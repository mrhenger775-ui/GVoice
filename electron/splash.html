<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GVoice Loading</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020617;
      }

      .wrap {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 70%);
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <video autoplay muted loop playsinline>
        <source src="./assets/Runway.mp4" type="video/mp4" />
      </video>
    </div>
  </body>
</html>
