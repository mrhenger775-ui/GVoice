version: "3.9"

services:
  livekit-redis:
    image: redis:7-alpine
    container_name: gvoice-livekit-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - livekit_redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: gvoice-livekit
    restart: unless-stopped
    depends_on:
      - livekit-redis
    command: ["--config", "/etc/livekit/livekit.yaml"]
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro

  coturn:
    image: coturn/coturn:4.6.2
    container_name: gvoice-coturn
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf", "--log-file=stdout"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  livekit_redis_data:
